name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung step (e.g. pnpm/action-setup) would otherwise hold the runner for the 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # docs/traceability.md is generated: fail if the committed copy is stale.
      - run: pnpm test:matrix && git diff --exit-code docs/traceability.md

  # Separate job, so an advisory never hides lint/test results from the verify job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on high/critical advisories. Dependabot alerts may not cover pnpm 12 lockfiles.
      - run: pnpm audit --audit-level high
