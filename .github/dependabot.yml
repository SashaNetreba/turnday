version: 2
updates:
  # pnpm workspace: Dependabot reads pnpm-workspace.yaml and pnpm-lock.yaml from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # minor and patch updates of devDependencies arrive as one PR;
      # major updates are not grouped, so each one gets its own PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Types follow the Node runtime (.nvmrc 22): bump them together with Node, by hand.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
